name: E2E

# Runs on every pull request and on main, not only when a release tag is cut:
# the suite used to run on tags alone, so regressions surfaced at release time
# with hundreds of commits to bisect. `workflow_call` lets release.yml keep it
# as its gate without duplicating the job.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: nvmrc
        run: echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node }}
          cache: 'pnpm'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild native modules for Electron
        run: pnpm --filter @spexr/desktop run rebuild

      - name: Build (dev)
        run: pnpm build:dev

      - name: Run E2E tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            bash -c "pnpm --filter @spexr/e2e test:e2e"
        env:
          DISPLAY: ":99"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SPEXR</title>
</head>

<body>
    <div class="theia-preload"><!--
  Injected into index.html's .theia-preload div (theia.generator.config.preloadTemplate),
  so it runs at parse time — before bundle.js, which is what loads every stylesheet.

  Without it the first paint is Theia's own default theme, resolved from the OS
  rather than from the SPEXR preference, so a dark-themed SPEXR on a light macOS
  flashes light. This resolves the SPEXR theme the same way SpexrThemeContribution
  does and paints the matching canvas immediately.

  The inline background is handed back to the stylesheet by SpexrThemeContribution
  (it removes the property), otherwise it would outrank every later theme change.
-->
<style>
  /* Transparent, so the html canvas below shows through for the whole startup:
     this element's own background is a theme variable that does not exist yet. */
  .theia-preload { background: transparent; }
</style>
<script>
  (function () {
    var theme;
    try {
      // The user's explicit choice, then the theme the last run actually
      // painted, then Theia's own persisted theme id (present in profiles that
      // predate the second key).
      theme = localStorage.getItem('spexr.theme')
        || localStorage.getItem('spexr.theme.last')
        || ({ light: 'light', dark: 'dark', 'hc-theia': 'high-contrast' })[localStorage.getItem('theme')];
    } catch (e) { /* storage blocked */ }
    if (theme !== 'light' && theme !== 'dark' && theme !== 'high-contrast') {
      // Last resort. Note this is NOT the OS setting during startup: in Electron
      // prefers-color-scheme follows nativeTheme.themeSource, which Theia only
      // forces to the app's theme once the bundle has loaded.
      theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var canvas = theme === 'light' ? '#ECE4D4' : '#070A0D';
    var root = document.documentElement;
    root.setAttribute('data-sl-theme', theme);
    root.style.background = canvas;
    // Theia's ThemePreloadContribution runs later, from the bundle, and copies
    // this key into --theia-editor-background — the color every shell surface
    // paints with before any stylesheet applies. Theia fills it from the
    // built-in theme (white / #1E1E1E), so seed it here or the first launch
    // after a fresh profile still flashes.
    try { localStorage.setItem('theme.background', canvas); } catch (e) { /* storage blocked */ }
    // The only honest reading of the OS preference in this process: Electron's
    // renderer follows nativeTheme.themeSource, which Theia pins to the
    // application's own theme once the bundle loads. SpexrThemeContribution
    // reads this instead of querying live.
    try {
      localStorage.setItem('spexr.os.dark', matchMedia('(prefers-color-scheme: dark)').matches ? '1' : '0');
    } catch (e) { /* storage blocked */ }
  })();
</script>
</div>
    <script type="text/javascript" src="./bundle.js" charset="utf-8"></script>
</body>

</html>
